apiVersion: v1
kind: Service
metadata:
  name: sensor-guard-metrics
  labels:
    app: sensor-guard
    component: observability
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9001"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP          # Внутренний сервис для сбора метрик
  ports:
    - name: metrics
      port: 9001
      targetPort: metrics
      protocol: TCP
  selector:
    app: sensor-guard
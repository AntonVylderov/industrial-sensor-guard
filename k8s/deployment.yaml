apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-guard
  labels:
    app: sensor-guard
    component: backend
  # Аннотации для мониторинга (если Prometheus использует service discovery)
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9001"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1                # Один экземпляр; масштабируется при необходимости
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # Zero-downtime deployments
  selector:
    matchLabels:
      app: sensor-guard
  template:
    metadata:
      labels:
        app: sensor-guard
        version: v0.1.0
    spec:
      # Безопасность контейнера
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sensor-guard
          image: ghcr.io/antonyvylderov/industrial-sensor-guard:v0.1.0
          imagePullPolicy: IfNotPresent
          # Переменные окружения
          env:
            - name: RUST_LOG
              value: "info"
          ports:
            - name: metrics
              containerPort: 9001
              protocol: TCP
          # Проверки жизнеспособности (используем /metrics – эндпоинт всегда отвечает)
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          # Ресурсы – защита от перерасхода
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # Усиление безопасности
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 15  # Даём время на graceful shutdown
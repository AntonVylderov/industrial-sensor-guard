[package]
name = "industrial-sensor-guard"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"

# Метрики
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Ручной HTTP-сервер для метрик
hyper = "1"
hyper-util = "0.1"
http-body-util = "0.1"
bytes = "1"